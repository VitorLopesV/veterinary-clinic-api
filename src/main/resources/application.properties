# URL do banco
spring.datasource.url=jdbc:mysql://localhost:3306/veterinarianClinic

# Usuário do banco
spring.datasource.username=root

# Senha
spring.datasource.password=root

# JPA (Controla o que o Hibernate faz com as tabelas)
# Quando sua aplicação inicia, ele compara suas entidades Java com o banco.
spring.jpa.hibernate.ddl-auto=update

# Mostrar SQL no console
spring.jpa.show-sql=true

# Formatar SQL
spring.jpa.properties.hibernate.format_sql=true